name: GenVo browser boot and save smoke
on:
  push:
    branches:
      - codex/repository-consolidation
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genvo-playable-browser-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  real-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@latest
          npx playwright install --with-deps chromium
      - name: Regenerate ignored sprite references and audit canonical source
        run: |
          node tools/export_sprite_sheets.cjs
          node tools/canonical-source-audit.mjs
          node tests/public-export.mjs
      - name: Boot real game and verify actual browser saves
        run: node tools/verify-save-coherence-browser.mjs docs/test-runs/playable-browser-ci
      - name: Launch a fresh world and verify native anatomy render
        run: node tools/verify-e4-browser-art.mjs
      - name: Start the verified evolved valley in real Chromium
        run: node tools/verify-scenario-browser.mjs docs/test-runs/scenario-browser-ci
      - name: Start genuine continued Day 100 ecosystem in real Chromium
        run: node tools/verify-scenario-browser.mjs docs/test-runs/scenario-day100-browser-ci mature-valley-d100
      - name: Follow the real mating tutorial controls
        run: node tools/review-tutorial-direction.cjs docs/test-runs/mating-coach-ci --coach
      - name: Preserve browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genvo-playable-browser
          path: |
            docs/test-runs/playable-browser-ci/
            docs/test-runs/e4-browser-review/
            docs/test-runs/scenario-browser-ci/
            docs/test-runs/scenario-day100-browser-ci/
            docs/test-runs/mating-coach-ci/
          if-no-files-found: ignore
