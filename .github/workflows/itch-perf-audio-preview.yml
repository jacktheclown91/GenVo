name: GenVo perf and audio preview candidate

on:
  push:
    branches:
      - fix/itch-preview-frame-audio-2026-10-20
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genvo-perf-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify origin
        shell: bash
        run: |
          set -euo pipefail
          ROOT=e486b359f30343d8c47efb5b4326cf877884d5e2
          test "$(git merge-base HEAD "$ROOT")" = "$ROOT"

      - name: Focused playability checks
        run: node tools/check-playable.mjs

      - name: Rendering and pacing regression
        shell: bash
        run: |
          set -euo pipefail
          node tests/render-cache.mjs
          node tests/habitat-ground-art.mjs
          node tests/scene.mjs
          node tests/frame-stepper.mjs

      - name: Audio regression
        run: node tests/audio.mjs

      - name: Export equivalence, including real Day 30/100 checkpoints
        run: node tests/public-export.mjs

      - name: Create verified candidate ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/genvo-web"
          node tools/export-public.mjs "$RUNNER_TEMP/genvo-web"
          python3 tools/package-itch-preview.py "$RUNNER_TEMP/genvo-web" \
            "$RUNNER_TEMP/GenVo_Itch_PerfAudio_Candidate.zip" \
            "$RUNNER_TEMP/GenVo_Itch_PerfAudio_Candidate-report.json"

      - name: Upload game ZIP and verification report
        uses: actions/upload-artifact@v4
        with:
          name: GenVo_Itch_PerfAudio_Candidate
          path: |
            ${{ runner.temp }}/GenVo_Itch_PerfAudio_Candidate.zip
            ${{ runner.temp }}/GenVo_Itch_PerfAudio_Candidate-report.json
          if-no-files-found: error
          retention-days: 14
