name: GenVo full-world restore parity
on:
  push:
    branches:
      - codex/repository-consolidation
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: genvo-world-restore-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  regional-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore source syntax
        run: |
          node --check src/world/world.js
          node --check src/persistence/save-manager.js
          node --check src/sim/simulation.js
      - name: Allocation-only restore matches canonical generated world
        run: node tests/world-restore-generation-parity.mjs
      - name: Restore surveyed neighbor worlds without regenerating ecology
        run: node tests/region-restore-direct-parity.mjs
      - name: Planetary border archive and global authority clone parity
        run: node tests/planetary-handoff-copy-parity.mjs
      - name: Detached snapshot buffer ownership and deep-clone reference
        run: |
          node tests/restore-detached-seed-ownership.mjs
          node tests/restore-detached-world-buffers.mjs
      - name: Pure-physical archived seasons and detached weather restore parity
        run: |
          node tests/e17-offscreen-environment.mjs
          node tests/offscreen-environment-detached-parity.mjs
      - name: Compare full-clone and detached legacy weather restore transport
        run: node tools/benchmark-legacy-offscreen-restore.mjs
      - name: Planetary ocean and river finite boundary conservation
        run: |
          node --check src/world/environment.js
          node --check src/world/planet-world.js
          node --check src/world/planetary-internal-water.js
          node tests/planetary-internal-water.mjs
          node tests/planetary-boundary-exchange.mjs
          node tests/regional-environment.mjs
          node tests/planet-geography.mjs
      - name: Genuine two-owner planetary salt transport and exact save parity
        run: |
          node --check src/world/planetary-seam-salt.js
          node tests/planetary-paired-seam-salt.mjs
      - name: Authentic remote organisms and exact offscreen resources
        run: node tests/e18-offscreen-biology.mjs
      - name: Synchronized three-region journey and mid-barrier saves
        run: node tests/regional-synchronized-replay.mjs
      - name: Save migrations and backwards compatibility
        run: node tests/save-persistence.mjs
      - name: Observe warm restore cost without outcome targets
        run: node tools/benchmark-world-restore.mjs
