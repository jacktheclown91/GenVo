name: GenVo playable checkpoint smoke
on:
  push:
    branches:
      - main
      - codex/repository-consolidation
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playable-checkpoint-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  everyday-play:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Focused local-play contract
        run: node tools/check-playable.mjs
